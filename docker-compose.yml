services:
  api:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CORS_ORIGIN=http://localhost:3000
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      # Pick ONE auth method for Firestore/Auth — see server/README.md.
      # A mounted key file (recommended for self-hosted/on-prem):
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-key.json
      # ...or inline JSON instead, if your platform can't mount files:
      # - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
    volumes:
      - ./server/serviceAccountKey.json:/run/secrets/firebase-key.json:ro
    restart: unless-stopped

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api
    restart: unless-stopped
